<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Juan Camilo Sanabria Durán — Software Developer and Writer</title>
  <desc id="desc">Banner azul con estrellas cayendo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061A40"/>
      <stop offset=".52" stop-color="#145DA0"/>
      <stop offset="1" stop-color="#A9D6E5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".28"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="34"/></clipPath>
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z" fill="url(#shine)"/>
    </symbol>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <path d="M0 210 Q230 170 430 215 T850 205 T1200 190 V260 H0Z" fill="#061A40" opacity=".12"/>
    <g opacity=".8">
      <use href="#star" x="80" y="-24" width="17" height="17"><animate attributeName="y" values="-24;280" dur="6s" repeatCount="indefinite"/></use>
      <use href="#star" x="210" y="-60" width="12" height="12"><animate attributeName="y" values="-60;280" dur="8s" begin="-3s" repeatCount="indefinite"/></use>
      <use href="#star" x="360" y="-35" width="20" height="20"><animate attributeName="y" values="-35;280" dur="7s" begin="-1s" repeatCount="indefinite"/></use>
      <use href="#star" x="540" y="-55" width="13" height="13"><animate attributeName="y" values="-55;280" dur="9s" begin="-5s" repeatCount="indefinite"/></use>
      <use href="#star" x="720" y="-30" width="18" height="18"><animate attributeName="y" values="-30;280" dur="6.5s" begin="-2s" repeatCount="indefinite"/></use>
      <use href="#star" x="910" y="-70" width="14" height="14"><animate attributeName="y" values="-70;280" dur="8.5s" begin="-4s" repeatCount="indefinite"/></use>
      <use href="#star" x="1080" y="-45" width="19" height="19"><animate attributeName="y" values="-45;280" dur="7.5s" begin="-2.5s" repeatCount="indefinite"/></use>
    </g>
    <g fill="#fff" opacity=".55">
      <circle cx="155" cy="55" r="2"/><circle cx="300" cy="190" r="1.7"/><circle cx="470" cy="48" r="1.5"/>
      <circle cx="650" cy="210" r="2"/><circle cx="835" cy="65" r="1.6"/><circle cx="1010" cy="185" r="2"/>
    </g>
    <text x="600" y="116" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing=".3">Juan Camilo Sanabria Durán</text>
    <text x="600" y="157" text-anchor="middle" fill="#fff" opacity=".94" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="2">SOFTWARE DEVELOPER  |  WRITER</text>
    <path d="M520 181 H680" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  </g>
</svg>